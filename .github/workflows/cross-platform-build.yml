name: Cross Platform Build

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: [self-hosted, macOS, ARM64]
            tauri_args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - name: windows-x64
            platform: windows-latest
            tauri_args: ""
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Resolve Python path
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python_bin="${pythonLocation}/python.exe"
          else
            python_bin="$(command -v python3)"
          fi
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
          "$python_bin" --version

      - name: Create backend virtual environment
        shell: bash
        run: |
          uv venv --python "$PYTHON_BIN" backend/.venv-ci
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            venv_python="$PWD/backend/.venv-ci/Scripts/python.exe"
          else
            venv_python="$PWD/backend/.venv-ci/bin/python"
          fi
          echo "VENV_PYTHON=$venv_python" >> "$GITHUB_ENV"
          "$venv_python" --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: uv pip install --python "$VENV_PYTHON" -r requirements.txt -r requirements-build.txt

      - name: Download FFmpeg for Windows bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ffmpeg_url="https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          ffmpeg_sha256="04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
          ffmpeg_zip="$RUNNER_TEMP/ffmpeg-essentials.zip"
          ffmpeg_extract_dir="$RUNNER_TEMP/ffmpeg-essentials"

          curl -L --fail --retry 3 --output "$ffmpeg_zip" "$ffmpeg_url"
          actual_sha256="$(sha256sum "$ffmpeg_zip" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$ffmpeg_sha256" ]]; then
            echo "FFmpeg checksum mismatch. Expected $ffmpeg_sha256, got $actual_sha256."
            exit 1
          fi

          powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ffmpeg_zip' -DestinationPath '$ffmpeg_extract_dir' -Force"
          ffmpeg_bin_dir="$(dirname "$(find "$ffmpeg_extract_dir" -type f -name ffmpeg.exe -print -quit)")"
          test -f "$ffmpeg_bin_dir/ffmpeg.exe"
          test -f "$ffmpeg_bin_dir/ffprobe.exe"
          echo "LOKA_BUNDLE_FFMPEG_DIR=$ffmpeg_bin_dir" >> "$GITHUB_ENV"

      - name: Run backend tests
        shell: bash
        run: '"$VENV_PYTHON" -m pytest backend/tests --ignore=backend/tests/test_supabase_client.py'

      - name: Build backend server
        shell: bash
        run: '"$VENV_PYTHON" backend/scripts/build_backend_binary.py'

      - name: Smoke test packaged backend
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            backend_exe="backend/dist/backend-server/backend-server.exe"
          else
            backend_exe="backend/dist/backend-server/backend-server"
            chmod +x "$backend_exe"
          fi

          export LOKA_STORAGE_DIR="$RUNNER_TEMP/loka15-backend-smoke"
          export LOKA_BACKEND_PORT="8765"
          export LOKA_BACKEND_SHUTDOWN_TOKEN="ci-smoke-token"

          "$backend_exe" > "$RUNNER_TEMP/backend-smoke.log" 2>&1 &
          backend_pid=$!

          cleanup() {
            curl -fsS -X POST -H "x-loka-shutdown-token: ci-smoke-token" http://127.0.0.1:8765/shutdown >/dev/null 2>&1 || true
            kill "$backend_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              curl -fsS http://127.0.0.1:8765/version
              curl -fsS http://127.0.0.1:8765/api/config/runtime >/dev/null
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                media_json="$(curl -fsS http://127.0.0.1:8765/api/system/media-binaries)"
                MEDIA_JSON="$media_json" "$VENV_PYTHON" -c "import json, os, sys; data=json.loads(os.environ['MEDIA_JSON']); print(data); missing=[name for name, details in data.items() if not details.get('available')]; sys.exit(1 if missing else 0)"
              fi
              exit 0
            fi
            if ! kill -0 "$backend_pid" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/backend-smoke.log"
              exit 1
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/backend-smoke.log"
          exit 1

      - name: Stage backend server for Tauri bundle
        shell: bash
        run: |
          rm -rf src-tauri/resources/backend
          mkdir -p src-tauri/resources/backend
          cp -R backend/dist/backend-server/. src-tauri/resources/backend/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f src-tauri/resources/backend/backend-server.exe
          else
            test -f src-tauri/resources/backend/backend-server
            chmod +x src-tauri/resources/backend/backend-server
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.name }}-[bundle]
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Loka15 Studio {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
